# 다해 서버 한 대: EC2 (Ubuntu 24.04) + 고정 IP + 매일 디스크 스냅샷 + 자동 복구 + GitHub 배포 권한
# + 외부 백업 저장소(S3, 키 입력 없음) + 서버 이상 알림 메일(SNS, 처음 한 번 메일의 Confirm subscription 을 눌러요).
# AWS 콘솔 > CloudFormation > 스택 생성 > 템플릿 파일 업로드 로 여세요. 순서는 docs/guide/10-AWS-배포.md.
# 릴리스마다 scripts/release/build-aws-template.sh 가 아래 두 자리표시자를 그 버전의 install.sh 주소와 지문으로 바꿔요.
# Filled per release (the template is not launchable with the placeholders still in it).
AWSTemplateFormatVersion: "2010-09-09"
Description: Dahae server on EC2 (Ubuntu 24.04), elastic IP, daily EBS snapshots, offsite S3 backups, alarm e-mails, GitHub Actions deploy role.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "도메인과 연락처 / Domain and contact" }
        Parameters: [Domain, Email, HostedZoneId]
      - Label: { default: "서버 / Server" }
        Parameters: [InstanceType, DiskSizeGiB, VpcId, SubnetId, SshCidr]
      - Label: { default: "GitHub 배포 / GitHub deploy" }
        Parameters: [GitHubRepo, GitHubRepoIds, GitHubEnvironment, CreateGitHubOidcProvider]
      - Label: { default: "고급 - 바꾸지 마세요 / Advanced - do not change" }
        Parameters: [AmdAmiId, ArmAmiId]

Parameters:
  Domain:
    Type: String
    Description: "고객이 쓸 주소 (예: app.example.co.kr). 아직 없으면 auto: <서버 IP>.sslip.io 임시 주소 (나중에 콘솔에서 바꿔요). Customer-facing domain, or auto for a temporary <ip>.sslip.io address (change it later in the console)."
    AllowedPattern: "^(auto|(?!-)[a-z0-9-]+(\\.[a-z0-9-]+)+)$"
    ConstraintDescription: "소문자 도메인 이름이어야 해요 (예: app.example.co.kr). Lowercase domain name."
  Email:
    Type: String
    Description: 인증서 안내와 서버 이상 알림을 받을 이메일 (알림은 처음 온 메일에서 한 번 확인해요). Email for certificate notices and server alarms (confirm the first mail once).
    AllowedPattern: "^[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"
    ConstraintDescription: 이메일 주소 형식이어야 해요. Must be an email address.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 호스트 영역 ID (Z로 시작). 비워 두면 A 레코드는 직접 만드세요. Optional Route 53 zone ID.
    AllowedPattern: "^$|^Z[A-Z0-9]+$"
    ConstraintDescription: Z 로 시작하는 영역 ID 또는 비워 두세요. Zone ID starting with Z, or empty.
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t3.large, t4g.medium, t4g.large]
    Description: 서버 크기. t4g 는 ARM, t3 는 x86 이에요. Server size (t4g is ARM).
  DiskSizeGiB:
    Type: Number
    Default: 50
    MinValue: 30
    MaxValue: 1000
    Description: 디스크 크기 GiB (암호화, gp3). Disk size in GiB (encrypted, gp3).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 서버를 넣을 VPC. VPC for the server.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: 인터넷으로 나갈 수 있는 공개 서브넷 (라우팅 표에 인터넷 게이트웨이가 있어야 해요). Must be a public subnet.
  SshCidr:
    Type: String
    Default: ""
    Description: "SSH(22) 를 열 IP 범위 (예: 203.0.113.10/32). 비워 두면 SSH 를 열지 않아요. 기본은 비움 (SSM 으로 접속)."
    AllowedPattern: "^$|^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$"
    ConstraintDescription: IPv4 주소/길이 형식이거나 비워 두세요. IPv4 CIDR or empty.
  GitHubRepo:
    Type: String
    Default: EricWijesinghe/Dahae
    AllowedPattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$"
    ConstraintDescription: owner/repo 형식이어야 해요. Must be owner/repo.
  GitHubRepoIds:
    Type: String
    Default: EricWijesinghe@48539716/Dahae@1452913067
    AllowedPattern: "^[A-Za-z0-9._-]+@[0-9]+/[A-Za-z0-9._-]+@[0-9]+$"
    Description: "GitHub 로그인 주체 owner@번호/repo@번호 (기본값 그대로). OIDC subject owner@ownerId/repo@repoId: gh api repos/OWNER/REPO --jq '.owner.id,.id'."
    ConstraintDescription: owner@숫자/repo@숫자 형식이어야 해요. Must be owner@id/repo@id.
  GitHubEnvironment:
    Type: String
    Default: doda-aws
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    ConstraintDescription: 영문, 숫자, -, _ 만 쓸 수 있어요. Letters, digits, - and _ only.
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: 이 계정에 GitHub 로그인 제공자가 아직 없으면 true, 이미 있으면 false. true unless the account already has the GitHub OIDC provider.
  AmdAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Canonical Ubuntu 24.04 x86_64 (공식 SSM 경로). Do not change.
  ArmAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
    Description: Canonical Ubuntu 24.04 arm64 (공식 SSM 경로). Do not change.

Conditions:
  AutoDomain: !Equals [!Ref Domain, auto]
  HasDomainRecord: !And [!Not [!Equals [!Ref HostedZoneId, ""]], !Not [!Condition AutoDomain]]
  HasSsh: !Not [!Equals [!Ref SshCidr, ""]]
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]
  UseArm: !Equals [!Select [0, !Split [".", !Ref InstanceType]], t4g]

Resources:
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Dahae web (80, 443) and SSH only when SshCidr is set
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP for certificates and redirect }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - !If [HasSsh, { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SshCidr, Description: SSH from SshCidr }, !Ref AWS::NoValue]
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-sg" }

  ElasticIp:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-ip" }

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomainRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Domain
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ElasticIp]

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref ServerInstance

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      # Created once by the account admin from deploy/aws/dahae-boundary-policy.json; the deployer cannot make a role without it.
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/dahae-boundary"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        # The app backs up with this role (no keys typed). No delete: a taken-over server cannot wipe the copies.
        - PolicyName: offsite-backup-no-delete
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBackups
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
              - Sid: PutAndGetBackups
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${BackupBucket.Arn}/*"

  # Offsite backups: the app encrypts every file before upload. Old copies go by lifecycle (the server cannot delete):
  # a backup expires after 35 days, and an overwritten or expired version is kept 35 more days.
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-backups
            Status: Enabled
            ExpirationInDays: 35
            NoncurrentVersionExpiration: { NoncurrentDays: 35 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-backups" }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ServerInstance:
    Type: AWS::EC2::Instance
    # Deleting the stack ends the server (disk kept, see BlockDeviceMappings). A replacement keeps the old server.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      ImageId: !If [UseArm, !Ref ArmAmiId, !Ref AmdAmiId]
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref ServerSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      # Stack deletion needs this turned off first (EC2 console > Instance settings). It stops an accidental terminate.
      DisableApiTermination: true
      PropagateTagsToVolumeOnCreation: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        # 2: the app runs in a container (one hop more) and reads the backup role from here. Tokens stay required (IMDSv2).
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref DiskSizeGiB
            VolumeType: gp3
            Encrypted: true
            # The disk survives a terminate. Delete it yourself, after a checked backup.
            DeleteOnTermination: false
      UserData: !Base64
        Fn::Sub:
          - |
            #!/bin/bash
            set -euo pipefail
            curl -fsSL -o /root/dahae-install.sh __INSTALL_URL__
            echo '__INSTALL_SH_SHA256__  /root/dahae-install.sh' | sha256sum -c -
            MALKKEUM_DOMAIN=${SiteDomain} MALKKEUM_EMAIL=${Email} MALKKEUM_FIREWALL=on MALKKEUM_BACKUP_S3_BUCKET=${BackupBucket} MALKKEUM_BACKUP_S3_REGION=${AWS::Region} bash /root/dahae-install.sh
          # auto: the Elastic IP's own name on sslip.io until the owner moves to a real domain in the console.
          - SiteDomain: !If [AutoDomain, !Sub "${ElasticIp}.sslip.io", !Ref Domain]
      Tags:
        - { Key: Name, Value: !Sub "dahae-${AWS::StackName}" }
        - { Key: dahae-backup, Value: !Ref AWS::StackName }

  # Alarm e-mails to the owner. AWS sends a "Subscription Confirmation" mail first: one click on Confirm subscription.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Dahae server
      Subscription:
        - { Protocol: email, Endpoint: !Ref Email }

  # No disk-space alarm: the server has no CloudWatch agent, so EC2 reports no disk metric (dahae status checks disk).
  SystemCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: EC2 system check failed. Auto-recover moves the server to healthy hardware and the owner gets an e-mail.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions:
        - { Name: InstanceId, Value: !Ref ServerInstance }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover"
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: dlm.amazonaws.com }, Action: sts:AssumeRole }
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/dahae-boundary"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole"

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Daily snapshot of the dahae server disk keep 7 at 0300 Seoul
      State: ENABLED
      ExecutionRoleArn: !GetAtt BackupRole.Arn
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes: [VOLUME]
        TargetTags:
          - { Key: dahae-backup, Value: !Ref AWS::StackName }
        Schedules:
          - Name: daily
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ["18:00"] }
            RetainRule: { Count: 7 }
            CopyTags: true

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    # The provider belongs to the whole account: deleting this stack must not break other GitHub roles.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/dahae-boundary"
      MaxSessionDuration: 21600 # the deploy job may wait up to 6 h for `dahae update` (deploy-aws.yml)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # The repo uses GitHub's immutable subject (owner@id/repo@id), so a renamed or re-created repo cannot match.
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepoIds}:environment:${GitHubEnvironment}"
                # Only deploy-aws.yml on master may use this role: a branch cannot edit the workflow and reach the server.
                token.actions.githubusercontent.com:job_workflow_ref: !Sub "${GitHubRepo}/.github/workflows/deploy-aws.yml@refs/heads/master"
      Policies:
        - PolicyName: deploy-to-this-server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunShellOnThisServerOnly
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ServerInstance}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: ReadCommandResults
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*" # SSM does not scope these to one instance
              - Sid: ReadInstanceState
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*" # EC2 does not scope describe calls

Outputs:
  BackupBucket:
    Description: 외부 백업이 쌓이는 S3 저장소 (서버가 자동으로 써요). Offsite backup bucket (used automatically).
    Value: !Ref BackupBucket
  PublicIp:
    Description: 도메인 A 레코드에 넣을 고정 IP (Route 53 를 안 썼을 때). Elastic IP for the A record.
    Value: !Ref ElasticIp
  InstanceId:
    Description: GitHub 변수 AWS_INSTANCE_ID. Use as AWS_INSTANCE_ID.
    Value: !Ref ServerInstance
  DeployRoleArn:
    Description: GitHub 변수 AWS_DEPLOY_ROLE_ARN. Use as AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  AwsRegion:
    Description: GitHub 변수 AWS_REGION. Use as AWS_REGION.
    Value: !Ref AWS::Region
  DahaeDomain:
    Description: GitHub 변수 DAHAE_DOMAIN. Use as DAHAE_DOMAIN.
    Value: !If [AutoDomain, !Sub "${ElasticIp}.sslip.io", !Ref Domain]
  NextStepUrl:
    Description: 설치가 끝나면 여는 주소 (약 15분 뒤). Open after about 15 minutes.
    Value: !If [AutoDomain, !Sub "https://${ElasticIp}.sslip.io/admin", !Sub "https://${Domain}/admin"]
