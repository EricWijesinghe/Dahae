<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>카드 등록</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B1217; color: #EEF4F7;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .box { text-align: center; padding: 24px; }
    .spin { width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 50%; border: 4px solid rgba(255,255,255,.15); border-top-color: #1E9EBA; animation: r 1s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
  <!-- Toss Payments V2 JavaScript SDK (official CDN). -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
  <main class="box" aria-live="polite"><div class="spin" aria-hidden="true"></div><p>카드 등록창을 여는 중…</p></main>
  <script>
    // Source: https://docs.tosspayments.com/sdk/v2/js/payment (payment({customerKey}).requestBillingAuth).
    // Opened by the app in a WebView: /pay/toss-billing.html?channel=<billing client key>&issue=<customerKey>&method=card
    // Success lands on /pay/billing-done.html?customerKey=..&authKey=..; failure on ?code=..&message=..
    // The app reads authKey there and the server turns it into a billing key. Nothing card-related is kept here.
    (function () {
      var q = new URLSearchParams(location.search);
      var done = function (extra) {
        location.replace('/pay/billing-done.html?' + new URLSearchParams(extra || {}).toString());
      };
      var failed = function (e) { done({ code: (e && e.code) || 'SDK_ERROR', message: String((e && e.message) || e) }); };
      if (!window.TossPayments) return done({ code: 'SDK_UNAVAILABLE' });
      var url = location.origin + '/pay/billing-done.html';
      try {
        TossPayments(q.get('channel')).payment({ customerKey: q.get('issue') })
          .requestBillingAuth({ method: 'CARD', successUrl: url, failUrl: url })
          .catch(failed);
      } catch (e) {
        failed(e);
      }
    })();
  </script>
</body>
</html>
