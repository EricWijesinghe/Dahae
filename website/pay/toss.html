<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>결제</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B1217; color: #EEF4F7;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .box { text-align: center; padding: 24px; }
    .spin { width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 50%; border: 4px solid rgba(255,255,255,.15); border-top-color: #1E9EBA; animation: r 1s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
  <!-- Toss Payments V2 JavaScript SDK (official CDN). -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
  <main class="box" aria-live="polite"><div class="spin" aria-hidden="true"></div><p id="msg">결제창을 여는 중…</p></main>
  <script>
    // Source: https://docs.tosspayments.com/sdk/v2/js/payment (payment().requestPayment, Redirect mode) and
    // https://docs.tosspayments.com/sdk/v2/js/payment-direct (card.flowMode DIRECT + card.easyPay opens the wallet's own window).
    // Opened by the app: /pay/toss.html?checkout=..&channel=<client key>&amount=..&method=..&name=..&phone=..&back=..&app=..
    // orderId MUST be the checkout id: toss-success.html confirms it, and the server looks the payment up by it.
    (function () {
      var q = new URLSearchParams(location.search);
      var id = q.get('checkout');
      // Web app (/app/) opened this page in its own tab: remember where to resume, read by done.html.
      var back = q.get('back');
      if (back && back.indexOf('/app/') === 0) { try { sessionStorage.setItem('mk.payBack', back); } catch (e) { /* private mode */ } }
      var done = function (extra) {
        var p = new URLSearchParams(Object.assign({ paymentId: id || '' }, extra || {}));
        location.replace('/pay/done.html?' + p.toString());
      };
      var failed = function (e) { done({ code: (e && e.code) || 'SDK_ERROR', message: String((e && e.message) || e) }); };
      if (!id || !window.TossPayments) return done({ code: 'SDK_UNAVAILABLE' });
      var method = q.get('method') || 'card';
      var easy = { kakaopay: 'KAKAOPAY', naverpay: 'NAVERPAY', tosspay: 'TOSSPAY', payco: 'PAYCO', samsungpay: 'SAMSUNGPAY', applepay: 'APPLEPAY' };
      var req = {
        method: 'CARD',
        amount: { currency: 'KRW', value: Number(q.get('amount')) },
        orderId: id,
        orderName: q.get('name') || '청소 예약',
        successUrl: location.origin + '/pay/toss-success.html',
        // Toss appends code, message and orderId (no orderId on a cancel), so the checkout id rides along here.
        failUrl: location.origin + '/pay/done.html?paymentId=' + encodeURIComponent(id),
      };
      if (method === 'transfer') {
        req.method = 'TRANSFER';
        req.transfer = { cashReceipt: { type: '소득공제' } };
      } else if (method === 'virtual_account') {
        req.method = 'VIRTUAL_ACCOUNT';
        req.virtualAccount = { validHours: 24, cashReceipt: { type: '소득공제' } };
      } else if (method === 'phone') {
        req.method = 'MOBILE_PHONE';
      } else {
        req.card = easy[method] ? { flowMode: 'DIRECT', easyPay: easy[method] } : { flowMode: 'DEFAULT' };
        // In-app WebView: the app's URL scheme, so ISP / app-card apps can send the customer back (card.appScheme).
        var app = q.get('app');
        if (app && /^[a-z][a-z0-9+.-]*:\/\/$/.test(app)) req.card.appScheme = app;
      }
      var phone = (q.get('phone') || '').replace(/\D/g, '');
      if (phone.length >= 8 && phone.length <= 15) req.customerMobilePhone = phone;
      try {
        TossPayments(q.get('channel')).payment({ customerKey: TossPayments.ANONYMOUS }).requestPayment(req).catch(failed);
      } catch (e) {
        failed(e);
      }
    })();
  </script>
</body>
</html>
