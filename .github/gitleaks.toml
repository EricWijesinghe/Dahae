# Secret scan of the tree (ci.yml job secrets): gitleaks' default rules plus the known fake values below.
# A new finding fails CI. Real secret: remove it and rotate it. Fake test value: add the narrowest
# path or line pattern here, never a whole source directory.
[extend]
useDefault = true

[[allowlists]]
description = "Test-only key fixtures, product prototypes and the installer self-test"
paths = [
  '''^backend/crates/api/src/providers/testdata/test_only_[A-Za-z0-9_]+\.(pem|p8)$''',
  '''^docs/specs/[A-Za-z0-9_-]+\.html$''',
  '''^scripts/ci/installer-selftest\.sh$''',
]

[[allowlists]]
description = "Fake credentials inside Rust unit tests"
regexTarget = "line"
regexes = [
  '''json!\(\{"store_id": "store-1", "api_secret": "k", "webhook_secret": "whsec_aGVsbG8="''',
  '''"private_key": "-----BEGIN PRIVATE KEY-----\\nx"''',
  '''"secret_key": "test_sk_x", "security_key": "0123456789abcdef"\.repeat\(4\)''',
  '''verify\(&KEY, "fedcba9876543210fedcba9876543210\.jpg"''',
]

[[allowlists]]
description = "Published test vectors and fixture values in tests and job fixtures"
regexTarget = "line"
regexes = [
  '''(token|progress)=0123456789abcdef0123456789abcdef''',
  '''^const _token = '0123456789abcdef0123456789abcdef';$''',
  '''otpauth://totp/Dahae:server\?secret=(ABCDEFGHIJKLMNOPQRSTUVWXYZ234567|X{32})&issuer=Dahae''',
  '''"api_secret": "fake-portone-api-secret-000000"''',
  '''"secret_key": "(sk_plain|test_sk_abcdef1234|live_sk_zz9876)"''',
  '''\('portone', 'webhook_secret', 'whsec_aGVsbG8=', null\)''',
  '''\('payout', 'security_key', '0123456789abcdef'( \* 4, null|, 'invalid_security_key')\)''',
  '''\('tosspayments', 'security_key', 'abcdef0123456789' \* 4, null\)''',
  '''Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==''',
  '''SECRET=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ # the RFC 6238 test key''',
  '''"email": "consult-new@test\.local", "name": "Consult", "role": "consultant", "password": "Dahae-consult-2026"''',
]
